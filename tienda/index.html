<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #f0f0ec;
    --ink: #0f0f0f;
    --ink-2: #3a3a3a;
    --muted: #75756f;
    --line: #e6e6e0;
    --black: #0a0a0a;
    --yellow: #fffc3a;
    --yellow-2: #f5e900;
    --yellow-soft: #fffbcc;
    --ok: #138a47;
    --ok-soft: #e4f6eb;
    --warn: #b45309;
    --danger: #d92d20;
    --wa: #25d366;
    --header-bg: rgba(255,255,255,.82);
    --tabbar-bg: rgba(255,255,255,.92);
    --thumb-hi: #ffffff;
    --danger-soft: #fdecea;
    --warn-soft: #fff4e5;
    --info: #1d4ed8;
    --info-soft: #eaf1ff;
    --service-ink: #3d3b00;
    --dark-hover: #262626;
    --chip-ink-on-dark: #fff;
    --r-sm: 10px;
    --r: 16px;
    --r-lg: 24px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.12);
    --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.35);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  /* ---------- Modo noche ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0c0b; --surface: #161614; --surface-2: #20201d; --ink: #f2f2ea; --ink-2: #cfcfc6; --muted: #9b9b91; --line: #2b2b27;
      --black: #000000; --yellow-soft: #2e2c0a; --ok: #3ccf7c; --ok-soft: #12301f; --warn: #f5a524; --danger: #ff6b5e;
      --header-bg: rgba(14,14,13,.82); --tabbar-bg: rgba(14,14,13,.92); --thumb-hi: #262622;
      --danger-soft: #3a1714; --warn-soft: #36260b; --info: #93b4ff; --info-soft: #172344; --service-ink: #3d3b00; --dark-hover: #1f1f1d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0b; --surface: #161614; --surface-2: #20201d; --ink: #f2f2ea; --ink-2: #cfcfc6; --muted: #9b9b91; --line: #2b2b27;
    --black: #000000; --yellow-soft: #2e2c0a; --ok: #3ccf7c; --ok-soft: #12301f; --warn: #f5a524; --danger: #ff6b5e;
    --header-bg: rgba(14,14,13,.82); --tabbar-bg: rgba(14,14,13,.92); --thumb-hi: #262622;
    --danger-soft: #3a1714; --warn-soft: #36260b; --info: #93b4ff; --info-soft: #172344; --service-ink: #3d3b00; --dark-hover: #1f1f1d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  /* En modo noche los botones negros llevan borde para no perderse en el fondo */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-dark, :root:not([data-theme="light"]) .icon-btn.dark { border: 1px solid #3a3a35; } }
  :root[data-theme="dark"] .btn-dark, :root[data-theme="dark"] .icon-btn.dark { border: 1px solid #3a3a35; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { box-shadow: inset 0 0 0 1px #2a2a24; } }
  :root[data-theme="dark"] .hero { box-shadow: inset 0 0 0 1px #2a2a24; }
  body, header, .card, .modal, .drawer, .tabbar { transition: background-color .3s ease, border-color .3s ease, color .3s ease; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .lucide { width: 1.15em; height: 1.15em; stroke-width: 2; flex-shrink: 0; vertical-align: middle; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Announcement ---------- */
  .announce { background: var(--black); color: #d9d9d4; font-size: 13px; }
  .announce .wrap { display: flex; gap: 22px; justify-content: center; align-items: center; padding-top: 8px; padding-bottom: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .announce span { display: inline-flex; align-items: center; gap: 6px; }
  .announce .lucide { color: var(--yellow); width: 15px; height: 15px; }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 30; background: var(--header-bg); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 14px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap; }
  .logo img { width: 42px; height: 42px; border-radius: 10px; display: block; }
  .logo b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.2px; line-height: 1.1; }
  .logo small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  .search { flex: 1; position: relative; max-width: 560px; margin: 0 auto; }
  .search .lucide { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { width: 100%; padding: 12px 16px 12px 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); outline: none; transition: border-color .2s, box-shadow .2s, background .2s; }
  .search input:focus { background: var(--surface); border-color: var(--black); box-shadow: 0 0 0 4px rgba(255,252,58,.6); }
  .head-actions { display: flex; gap: 8px; }
  .icon-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; transition: border-color .2s, transform .15s; }
  .icon-btn:hover { border-color: var(--black); }
  .icon-btn:active { transform: scale(.97); }
  .icon-btn.dark { background: var(--black); color: #fff; border-color: var(--black); }
  .badge { position: absolute; top: -5px; right: -5px; background: var(--yellow); color: var(--black); border: 2px solid var(--surface); font-size: 11px; font-weight: 800; border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 5px; }
  .badge.bump { animation: bump .4s var(--ease); }
  @keyframes bump { 40% { transform: scale(1.35); } }
  .cats-nav { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
  .cats-nav::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; white-space: nowrap; font-size: 13px; font-weight: 600; transition: all .2s; }
  .chip:hover { border-color: var(--black); }
  .chip.active { background: var(--black); color: var(--yellow); border-color: var(--black); }

  main { padding-top: 20px; padding-bottom: 20px; }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; background: var(--black); color: #fff; border-radius: var(--r-lg); padding: clamp(28px, 5vw, 56px); display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; isolation: isolate; }
  .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,252,58,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,252,58,.07) 1px, transparent 1px); background-size: 36px 36px; mask-image: radial-gradient(ellipse at 70% 50%, #000 20%, transparent 75%); }
  .hero::after { content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,252,58,.35), transparent 65%); z-index: -1; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,252,58,.12); color: var(--yellow); border: 1px solid rgba(255,252,58,.3); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .hero h1 { margin: 16px 0 10px; font-size: clamp(32px, 5.2vw, 58px); line-height: 1.02; letter-spacing: -1.5px; font-weight: 800; }
  .hero h1 em { font-style: normal; color: var(--yellow); }
  .hero p.lead { margin: 0 0 24px; color: #bdbdb6; font-size: clamp(15px, 1.6vw, 18px); max-width: 520px; line-height: 1.5; }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .stats { display: flex; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
  .stats b { display: block; font-size: 22px; color: var(--yellow); }
  .stats span { font-size: 13px; color: #9c9c95; }
  .hero-art { position: relative; display: grid; place-items: center; }
  .hero-art img { width: min(320px, 100%); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(255,252,58,.35); transform: rotate(-3deg); transition: transform .5s var(--ease); }
  .hero-art img:hover { transform: rotate(0) scale(1.02); }
  .float-card { position: absolute; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow-lg); }
  .float-card .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--yellow); }
  .float-card small { display: block; font-weight: 500; color: var(--muted); }
  .float-card.a { left: 0; bottom: 18%; }
  .float-card.b { right: 0; top: 10%; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 14px; transition: transform .15s, box-shadow .2s, background .2s; white-space: nowrap; }
  .btn:active { transform: scale(.97); }
  .btn-yellow { background: var(--yellow); color: var(--black); box-shadow: 0 6px 20px -6px rgba(245,233,0,.7); }
  .btn-yellow:hover { background: var(--yellow-2); }
  .btn-dark { background: var(--black); color: #fff; }
  .btn-dark:hover { background: var(--dark-hover); }
  .btn-glass { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); }
  .btn-glass:hover { background: rgba(255,255,255,.15); }
  .btn-outline { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .btn-outline:hover { border-color: var(--black); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-block { width: 100%; }
  .btn-lg { padding: 14px 22px; font-size: 15px; }

  /* ---------- Features ---------- */
  .features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; gap: 12px; align-items: center; }
  .feature .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--black); color: var(--yellow); display: grid; place-items: center; flex-shrink: 0; }
  .feature b { display: block; font-size: 14px; }
  .feature span { font-size: 12.5px; color: var(--muted); }

  /* ---------- Sections ---------- */
  section.row { margin-top: 40px; }
  .row-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .row-head .title { display: flex; align-items: center; gap: 12px; }
  .row-head .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--yellow); color: var(--black); display: grid; place-items: center; flex-shrink: 0; }
  .row-head h2 { margin: 0; font-size: clamp(18px, 2.4vw, 22px); letter-spacing: -.4px; }
  .row-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .link { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; font-weight: 700; font-size: 14px; padding: 8px 4px; white-space: nowrap; }
  .link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .scroller { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 250px); gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .scroller > * { scroll-snap-align: start; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .empty { color: var(--muted); background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; display: grid; justify-items: center; gap: 8px; }
  .empty .lucide { width: 28px; height: 28px; }

  /* ---------- Category tiles ---------- */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .cat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 14px; display: grid; justify-items: start; gap: 12px; text-align: left; transition: transform .2s var(--ease), border-color .2s, box-shadow .2s; }
  .cat-tile:hover { transform: translateY(-3px); border-color: var(--black); box-shadow: var(--shadow); }
  .cat-tile .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; transition: background .2s; }
  .cat-tile:hover .ic { background: var(--yellow); }
  .cat-tile .ic .lucide { width: 24px; height: 24px; }
  .cat-tile b { font-size: 13.5px; text-transform: capitalize; }
  .cat-tile span { font-size: 12px; color: var(--muted); }

  /* ---------- Product card ---------- */
  .card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: transparent; }
  .thumb { position: relative; aspect-ratio: 1/1; border-radius: 12px; background: radial-gradient(circle at 30% 20%, var(--thumb-hi), var(--surface-2) 70%); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
  .thumb .lucide { width: 38%; height: 38%; stroke-width: 1.4; color: var(--ink-2); transition: transform .4s var(--ease); }
  .card:hover .thumb .lucide { transform: scale(1.08) rotate(-4deg); }

  /* ---------- Logo animado para productos sin foto ---------- */
  .ph { position: relative; display: block; width: 44%; aspect-ratio: 1; border-radius: 16%; overflow: hidden; box-shadow: 0 14px 28px -14px rgba(0,0,0,.55); animation: phFloat 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); transition: transform .4s var(--ease); }
  .ph svg { display: block; width: 100%; height: 100%; }
  .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(-140%); animation: phShine 4.2s ease-in-out infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  .ph-arrow { transform-box: fill-box; transform-origin: center; animation: phArrow 1.8s cubic-bezier(.5,0,.3,1) infinite; animation-delay: var(--d, 0s); }
  .ph-screen { animation: phScreen 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .card:hover .ph { transform: scale(1.1) rotate(-4deg); }
  @keyframes phFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @keyframes phShine { 0%, 60% { transform: translateX(-140%); } 90%, 100% { transform: translateX(140%); } }
  @keyframes phArrow { 0%, 20% { transform: translate(0, 0); } 55% { transform: translate(14%, -14%); } 70% { transform: translate(10%, -10%); } 100% { transform: translate(0, 0); } }
  @keyframes phScreen { 0%, 100% { fill: #fffc3a; } 50% { fill: #fffef0; } }
  .detail-thumb .ph { width: 28%; }
  .mini .ph { width: 72%; box-shadow: none; animation: none; }
  .mini .ph::after, .mini .ph-arrow, .mini .ph-screen { animation: none; }
  .fly .ph { width: 100%; border-radius: 0; box-shadow: none; animation: none; }
  .card.is-out .ph, .card.is-out .ph::after, .card.is-out .ph-arrow, .card.is-out .ph-screen { animation: none; }
  /* Foto completa sobre la misma foto desenfocada que llena el cuadro; ambas fijas a los bordes para que Safari (iPhone) no las recorte */
  .thumb img.pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .4s var(--ease); }
  .thumb img.pic-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(16px) saturate(1.15); transform: scale(1.2); opacity: .85; }
  .card:hover .thumb img.pic { transform: scale(1.04); }
  .tags { z-index: 2; position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 4px 8px; }
  .tag .lucide { width: 12px; height: 12px; }
  .tag.off { background: var(--yellow); color: var(--black); }
  .tag.last { background: var(--black); color: var(--yellow); }
  .tag.out { background: var(--danger); color: #fff; }

  /* ---------- Etiquetas animadas ---------- */
  .tag { transition: transform .25s var(--ease); }
  .card:hover .tag { transform: translateY(-1px) scale(1.06); }
  .tag.off { position: relative; overflow: hidden; animation: tagPulse 2.6s ease-in-out infinite; box-shadow: 0 0 0 0 rgba(255,252,58,.7); }
  .tag.off::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.9) 50%, transparent 70%); transform: translateX(-130%); animation: tagShine 3.2s ease-in-out infinite; }
  @keyframes tagPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,252,58,.0); } 50% { box-shadow: 0 0 0 5px rgba(255,252,58,.45); } }
  @keyframes tagShine { 0%, 55% { transform: translateX(-130%); } 85%, 100% { transform: translateX(130%); } }
  .tag.last .lucide { animation: zapFlash 1.6s ease-in-out infinite; }
  @keyframes zapFlash { 0%, 100% { opacity: 1; transform: scale(1); } 45% { opacity: .35; transform: scale(.85); } 55% { opacity: 1; transform: scale(1.25); } }
  .tag.incart { margin-left: auto; background: var(--ok); color: #fff; box-shadow: 0 4px 12px -4px rgba(19,138,71,.6); }
  .tag.incart.pop { animation: tagPop .6s var(--ease); }
  @keyframes tagPop { 0% { transform: scale(.3); opacity: 0; } 55% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1); } }

  /* ---------- Animación al agregar al carrito ---------- */
  .fly { position: fixed; z-index: 90; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 18px; background: var(--yellow); display: grid; place-items: center; pointer-events: none; box-shadow: 0 12px 30px -8px rgba(0,0,0,.45); overflow: hidden; }
  .fly svg { width: 36px; height: 36px; color: var(--black); stroke-width: 1.8; }
  .fly img { width: 100%; height: 100%; object-fit: cover; }
  .fly img.pic-bg { display: none; }
  .float-num { position: fixed; z-index: 95; transform: translate(-50%, -50%); pointer-events: none; font-weight: 800; font-size: 20px; color: var(--black); background: var(--yellow); border: 2px solid var(--black); border-radius: 999px; padding: 2px 10px; animation: floatUp .9s var(--ease) forwards; box-shadow: 0 8px 18px -6px rgba(0,0,0,.35); }
  .float-num.minus { background: var(--surface); color: var(--danger); border-color: var(--danger); }

<body>

<div class="announce"><div class="wrap" id="announce"></div></div>

  <div class="wrap bar">

    <form class="search" id="searchForm" role="search"><i data-lucide="search"></i><input id="searchInput" type="search" placeholder="Buscar laptop, cargador, SSD, RAM…" aria-label="Buscar productos"></form>
    <div class="head-actions">
      <button class="icon-btn theme-btn" data-action="theme" id="themeBtn" aria-label="Activar modo noche" title="Modo noche"><i data-lucide="moon"></i></button>

      <button class="icon-btn dark" data-action="cart" aria-label="Carrito"><i data-lucide="shopping-bag"></i><span class="lbl">Carrito</span><span class="badge" id="cartCount">0</span></button>
    </div>

<button class="wa-float" data-action="whatsapp" aria-label="Escríbenos por WhatsApp"><i data-lucide="message-circle"></i><span>WhatsApp</span></button>

  <button data-action="home" data-tab="home"><i data-lucide="house"></i>Inicio</button>
  <button data-action="catalog" data-tab="catalog"><i data-lucide="layout-grid"></i>Catálogo</button>
  <button data-action="cart" data-tab="cart"><i data-lucide="shopping-bag"></i>Carrito<span class="badge" id="cartCount2">0</span></button>
  <button data-action="account" data-tab="account"><i data-lucide="user-round"></i>Cuenta</button>
</nav>

<div class="overlay" id="overlay" data-action="close"></div>

<aside class="drawer" id="cartDrawer" aria-label="Carrito">
  <div class="drawer-head"><h3><i data-lucide="shopping-bag"></i> Tu carrito</h3><button class="x" data-action="close" aria-label="Cerrar"><i data-lucide="x"></i></button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="cuentas.js"></script>
<script src="ficha.js"></script>
<script>
/* ======================================================
   DATOS — el catálogo vive en Supabase y se edita en vivo
   desde el panel /admin (productos, categorías y configuración).
   ====================================================== */
let CONFIG = {}, ICONS = {}, PRODUCTS = [], categories = [];
// Delivery y métodos de pago: se activan o desactivan desde Configuración del panel
const PAGOS_TODOS = ["Efectivo", "Transferencia", "Tarjeta al recibir"];
const deliveryOn = () => CONFIG.deliveryActivo !== false;
const pagosOn = () => (Array.isArray(CONFIG.pagos) && CONFIG.pagos.length ? CONFIG.pagos : PAGOS_TODOS);
async function loadCatalog() {
  const [s, c, p] = await Promise.all([
    sb.from("settings").select("data").eq("id", 1).maybeSingle(),
    sb.from("categories").select("name, icon, orden").order("orden"),
    sb.from("products").select("*").order("id"),
  ]);
  if (s.error || c.error || p.error) throw s.error || c.error || p.error;
  CONFIG = s.data?.data || {};
  ICONS = Object.fromEntries((c.data || []).map((x) => [x.name, x.icon]));
  PRODUCTS = (p.data || []).filter((x) => !x.oculto)
    .map((x) => ({ ...x, precio: Number(x.precio), descripcion: x.descripcion || "", img: x.img || "" }));
  categories = [...new Set([...Object.keys(ICONS), ...PRODUCTS.map((x) => x.cat)])].filter((k) => PRODUCTS.some((x) => x.cat === k));
  // El carrito se ajusta a la existencia real
  if (typeof state !== "undefined") {
    state.cart = state.cart.map((l) => { const q = byId(l.id); return q ? { ...l, qty: Math.min(l.qty, q.stock) } : null; }).filter((l) => l && l.qty > 0);
  }
}

/* ======================================================
   Utilidades
   ====================================================== */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("tc_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tc_" + k, JSON.stringify(v)); } catch {} },
};
const money = (n) => CONFIG.moneda + n.toLocaleString("en-US");
const byId = (id) => PRODUCTS.find((p) => p.id === id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (name) => `<i data-lucide="${name}"></i>`;
const refreshIcons = () => { if (window.lucide) lucide.createIcons(); };
const titleCase = (s) => s.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
/* Precio con descuento redondeado a múltiplos de 5 */
const finalPrice = (p) => p.oferta ? Math.round((p.precio * (1 - CONFIG.descuento / 100)) / 5) * 5 : p.precio;
/* Producto sin foto: logo de la tienda animado (la flecha "sube" y el logo flota).
   El desfase por id evita que todos se muevan al mismo tiempo. */
const logoPh = (id) => `<span class="ph" style="--d:${-((id || 0) % 6) * 0.45}s" role="img" aria-label="${esc(CONFIG.marca || "Logo")}">
  <svg viewBox="200 160 1160 1110" aria-hidden="true">
    <rect x="200" y="160" width="1160" height="1110" rx="120" fill="#0a0a0a"/>
    <path class="ph-sq" d="M350 207H1310V1166H651V823H350Z" fill="#fffc3a"/>
    <rect class="ph-sq" x="252" y="914" width="307" height="307" fill="#fffc3a"/>
    <path class="ph-arrow" d="M332 960H517V1143H462V1063L366 1166L326 1130L421 1018H332Z" fill="#0a0a0a"/>
    <g class="ph-laptop">
      <path d="M812 290L848 278L1225 337L1250 382L1152 662L1115 672L820 528Z" fill="#0a0a0a"/>
      <path class="ph-screen" d="M840 307L1190 378L1110 642L845 515Z" fill="#fffc3a"/>
      <path d="M597 638L815 530L1132 690L912 875L845 877L600 676Z" fill="#0a0a0a"/>
    </g>
  </svg></span>`;
// Título corto y ficha técnica sacados del nombre largo (ver ficha.js)
const ficha = (p) => Ficha.de(p.nombre, p.cat);
const titulo = (p) => ficha(p).titulo;
// Enlace propio de cada producto: /p/35-laptop-dell-latitude-3310
const slug = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
const rutaProducto = (p) => `/p/${p.id}-${slug(titulo(p))}`;
const urlProducto = (p) => location.origin + rutaProducto(p);
const idEnUrl = () => { const m = location.pathname.match(/^\/p\/(\d+)/) || location.search.match(/[?&]p=(\d+)/); return m ? Number(m[1]) : null; };
const tituloTienda = () => (CONFIG.marca || "Romana CompuService") + " - Tienda";
function salirDeProducto() {
  if (!idEnUrl()) return;
  history.pushState({}, "", "/");
  document.title = tituloTienda();
}
const icon = (p) => p.img ? `<img class="pic-bg" src="${esc(p.img)}" alt="" aria-hidden="true"><img class="pic" src="${esc(p.img)}" alt="">` : logoPh(p.id);
const waLink = (text) => `https://wa.me/${CONFIG.whatsapp}${text ? "?text=" + encodeURIComponent(text) : ""}`;
const igLink = () => `https://www.instagram.com/${CONFIG.instagram}/`;

/* ---------- Estado ---------- */
const state = {
  view: "home",            // home | catalog
  cat: null,
  q: "",
  list: null,              // lista especial: best | offers | again | inspired | new
  sort: "",
  qty: {},                 // cantidad elegida en cada tarjeta
  cart: store.get("cart", []),          // [{id, qty}]
  user: null,                           // perfil del cliente (Supabase)
  orders: [],                           // pedidos del cliente
  viewed: store.get("viewed", []),      // ids vistos recientemente
  bought: [],                           // ids comprados antes (de sus pedidos)
};
const save = () => { store.set("cart", state.cart); store.set("viewed", state.viewed); };

/* ---------- Listas inteligentes ---------- */
const available = (p) => p.stock > 0;
const lists = {
  best:     { t: "Más vendidos", i: "flame", s: "Lo que más piden nuestros clientes", f: () => [...PRODUCTS].sort((a, b) => b.vendidos - a.vendidos) },
  offers:   { t: "Ofertas del día", i: "zap", s: () => `${CONFIG.descuento}% OFF en estos productos`, f: () => PRODUCTS.filter((p) => p.oferta) },
  again:    { t: "Vuelve a comprar", i: "rotate-ccw", s: "Productos que ya compraste antes", f: () => state.bought.map(byId).filter(Boolean),
              empty: "Aquí aparecerán los productos que compres." },
  inspired: { t: "Inspirado en lo que viste", i: "sparkles", s: "Selección personalizada para ti", f: inspired,
              empty: "Mira algunos productos y te recomendaremos similares." },
  new:      { t: "Recién llegados", i: "package-open", s: "Lo último en inventario", f: () => [...PRODUCTS].sort((a, b) => b.nuevo.localeCompare(a.nuevo)) },
};
function inspired() {
  const seen = state.viewed.map(byId).filter(Boolean);
  if (!seen.length) return [];
  const cats = new Set(seen.map((p) => p.cat));
  const words = new Set(seen.flatMap((p) => p.nombre.toLowerCase().split(/\W+/).filter((w) => w.length > 3)));
  const score = (p) => (cats.has(p.cat) ? 2 : 0) + p.nombre.toLowerCase().split(/\W+/).filter((w) => words.has(w)).length;
  return PRODUCTS.filter((p) => score(p) > 0).sort((a, b) => score(b) - score(a));
}

/* ======================================================
   Render
   ====================================================== */
function card(p) {
  const fp = finalPrice(p);
  return `<article class="card ${available(p) ? "" : "is-out"}">
    <div class="thumb" data-action="detail" data-id="${p.id}">
      ${icon(p)}
      <div class="tags">
        ${p.oferta && available(p) ? `<span class="tag off">-${CONFIG.descuento}%</span>` : ""}
        ${inCartQty(p.id) ? `<span class="tag incart" data-incart="${p.id}">${ic("shopping-bag")}${inCartQty(p.id)}</span>` : ""}
        ${!available(p) ? '<span class="tag out">Agotado</span>' : ""}
      </div>
    </div>
    <div class="body">
      <div class="cat">${esc(titleCase(p.cat))}</div>
      <div class="name" data-action="detail" data-id="${p.id}">${esc(titulo(p))}</div>
      ${ficha(p).resumen.length ? `<div class="specs-mini">${ficha(p).resumen.map(esc).join(" · ")}</div>` : ""}
      <div class="prices"><span class="price">${money(fp)}</span>${p.oferta ? `<span class="price-old">${money(p.precio)}</span>` : ""}</div>
      ${available(p)
        ? `<span class="stock">${ic("circle-check")}En stock</span>
      <div class="buy-row"><button class="btn btn-dark btn-block add-btn" data-action="add" data-id="${p.id}">${ic("shopping-bag")}Agregar</button></div>`
        : `<div class="buy-row"><button class="btn btn-outline btn-block add-btn" data-action="notify" data-id="${p.id}">${ic("bell")}Avísame</button></div>`}
    </div>
  </article>`;
}

function row(key, items, opts = {}) {
  const L = lists[key] || opts;
  const sub = typeof L.s === "function" ? L.s() : L.s;
  const body = items.length
    ? `<div class="scroller">${items.slice(0, 12).map(card).join("")}</div>`
    : `<div class="empty">${ic(L.i)}${L.empty || "Sin productos por ahora."}</div>`;
  return `<section class="row">

/* ======================================================
   Animaciones del carrito
   ====================================================== */
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const center = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });

/* "+1" / "-1" que sube y se desvanece */
function floatNum(text, rect, minus = false) {
  if (!rect || reduceMotion()) return;
  const s = document.createElement("span");
  s.className = "float-num" + (minus ? " minus" : "");
  s.textContent = text;
  const c = center(rect);
  s.style.left = c.x + "px"; s.style.top = rect.top + "px";
  document.body.appendChild(s);
  s.addEventListener("animationend", () => s.remove());
}

/* Chispas amarillas y negras alrededor de un punto */
function sparks(rect) {
  if (!rect || reduceMotion()) return;
  const c = center(rect);
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("span");
    d.className = "spark";
    d.style.left = c.x + "px"; d.style.top = c.y + "px";
    d.style.background = i % 3 ? "var(--yellow)" : "var(--black)";
    document.body.appendChild(d);
    const ang = (Math.PI * 2 * i) / 10 + Math.random() * .4, dist = 34 + Math.random() * 26;
    d.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px) scale(.2)`, opacity: 0 }],
      { duration: 550 + Math.random() * 200, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => d.remove();
  }
}

/* El carrito visible: barra inferior en celular, encabezado en computadora */
function cartTarget() {
  const tab = $("#tabbar [data-tab=cart]");
  return tab && getComputedStyle($("#tabbar")).display !== "none" ? tab : $("header [data-action=cart]");
}

/* La foto (o ícono) del producto vuela en arco hasta el carrito */
function flyToCart(fromRect, p, done) {
  const target = cartTarget();
  if (!fromRect || !target || reduceMotion()) return done && done();
  const a = center(fromRect), b = center(target.getBoundingClientRect());
  const g = document.createElement("div");
  g.className = "fly";
  g.innerHTML = icon(p);
  g.style.left = a.x + "px"; g.style.top = a.y + "px";
  document.body.appendChild(g);
  refreshIcons();
  const dx = b.x - a.x, dy = b.y - a.y, lift = Math.min(160, Math.abs(dx) * .35 + 60);
  g.animate([
    { transform: "translate(0,0) scale(.6) rotate(0)", opacity: 0 },
    { transform: "translate(0,-12px) scale(1.05) rotate(-6deg)", opacity: 1, offset: .15 },
    { transform: `translate(${dx * .5}px, ${dy * .5 - lift}px) scale(.8) rotate(8deg)`, offset: .55 },
    { transform: `translate(${dx}px, ${dy}px) scale(.18) rotate(0)`, opacity: .7 },
  ], { duration: 780, easing: "cubic-bezier(.45,0,.25,1)" }).onfinish = () => { g.remove(); done && done(); };
}

function hitCart() {
  const t = cartTarget();
  if (t) { t.classList.remove("cart-hit"); void t.offsetWidth; t.classList.add("cart-hit"); }
  bumpBadge();
}

/* Botón "Agregar" → "¡Agregado!" por un momento */
function markAdded(id) {
  document.querySelectorAll(`[data-action="add"][data-id="${id}"]`).forEach((b) => {
    b.classList.add("added");
    b.innerHTML = `${ic("check")}¡Agregado!`;
    clearTimeout(b._t);
    b._t = setTimeout(() => { if (b.isConnected) { b.classList.remove("added"); b.innerHTML = `${ic("shopping-bag")}Agregar`; refreshIcons(); } }, 1400);
  });
  document.querySelectorAll(`[data-incart="${id}"]`).forEach((t) => t.classList.add("pop"));
  refreshIcons();
}

function addToCart(id, qty, srcEl) {
  const p = byId(id);
  const line = state.cart.find((l) => l.id === id);
  const current = line ? line.qty : 0;
  const n = Math.min(qty, p.stock - current);
  if (n <= 0) { toast("No hay más unidades disponibles", "alert-circle"); return false; }
  // Posiciones antes de re-dibujar (el re-dibujo reemplaza los elementos)
  const holder = srcEl && (srcEl.closest(".card") || srcEl.closest(".modal"));
  const thumb = holder && holder.querySelector(".thumb");
  const fromRect = (thumb || srcEl)?.getBoundingClientRect();
  const btnRect = srcEl?.getBoundingClientRect();
  line ? (line.qty += n) : state.cart.push({ id, qty: n });
  save(); render();
  markAdded(id);
  floatNum(`+${n}`, btnRect);
  sparks(btnRect);
  flyToCart(fromRect, p, hitCart);
  return true;
}
function markViewed(id) {
  state.viewed = [id, ...state.viewed.filter((x) => x !== id)].slice(0, 12);
  save();
}

/* ======================================================
   Cuentas de clientes (Supabase): registro con cédula,
   inicio de sesión, ubicación para delivery e historial.
   ====================================================== */
async function loadUser() {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { Object.assign(state, { user: null, orders: [], bought: [] }); subscribeOrders(); render(); return; }
  const { data: prof } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  state.user = prof || null;
  // Solo los pedidos de esta cuenta (un administrador puede leer todos, pero aquí no los mezclamos)
  const { data: ords } = prof ? await sb.from("orders").select("*").eq("user_id", prof.id).order("created_at", { ascending: false }).limit(30) : { data: [] };
  state.orders = ords || [];
  state.bought = [...new Set(state.orders.flatMap((o) => (o.items || []).map((i) => i.id)))];
  subscribeOrders();
  render();
}

function readLocation(form) {
  const f = Object.fromEntries(new FormData(form));
  const lat = f.lat === "" ? null : Number(f.lat), lng = f.lng === "" ? null : Number(f.lng);
  return { direccion: (f.direccion || "").trim(), sector: (f.sector || "").trim(), referencia: (f.referencia || "").trim() || null,
    lat: Number.isFinite(lat) ? lat : null, lng: Number.isFinite(lng) ? lng : null };
}

/* Código Plus de Google Maps (Open Location Code): sirve aunque la calle no tenga nombre */
function plusCode(lat, lng) {
  const A = "23456789CFGHJMPQRVWX";
  let la = Math.min(Math.max(lat, -90), 89.9999999) + 90, lo = ((lng + 180) % 360 + 360) % 360, c = "";
  for (let i = 0, d = 20; i < 5; i++, d /= 20) {
    const y = Math.floor(la / d + 1e-9), x = Math.floor(lo / d + 1e-9);
    la -= y * d; lo -= x * d; c += A[y] + A[x];
    if (i === 3) c += "+";
  }
  return c;
}

/* Convierte las coordenadas en calle y sector (OpenStreetMap). Si no hay datos, queda el código Plus. */
async function lookupAddress(lat, lng) {
  const code = plusCode(lat, lng);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=es&lat=${lat}&lon=${lng}`);
    if (!r.ok) throw 0;
    const a = (await r.json()).address || {};
    const calle = [a.road || a.pedestrian || a.residential || a.footway, a.house_number].filter(Boolean).join(" ");
    const barrio = a.neighbourhood || a.suburb || a.quarter || a.hamlet || a.city_district;
    const ciudad = a.city || a.town || a.village || a.municipality || a.county || a.state;
    return { direccion: calle || `Código Plus ${code}`, sector: [...new Set([barrio, ciudad].filter(Boolean))].join(", ") || "La Romana", code };
  } catch {
    return { direccion: `Código Plus ${code}`, sector: "La Romana", code };
  }
}

function useGps(btn) {
  const form = btn.closest("form"), status = form.querySelector("[data-gps-status]");
  if (!navigator.geolocation) { status.innerHTML = `<span class="bad">${ic("circle-x")}Tu dispositivo no permite compartir la ubicación.</span>`; return refreshIcons(); }
  status.innerHTML = `<span>${ic("loader-circle")}Buscando tu ubicación…</span>`; refreshIcons();
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    form.lat.value = lat.toFixed(6); form.lng.value = lng.toFixed(6);
    status.innerHTML = `<span>${ic("loader-circle")}Buscando tu dirección…</span>`; refreshIcons();
    const ad = await lookupAddress(lat, lng);
    form.direccion.value = ad.direccion;
    form.sector.value = ad.sector;
    if (!form.referencia.value.trim()) form.referencia.value = `Código Plus ${ad.code}`;
    [form.direccion, form.sector].forEach((i) => { i.classList.remove("filled"); void i.offsetWidth; i.classList.add("filled"); });
    btn.disabled = false;
    status.innerHTML = `${gpsSaved(form.lat.value, form.lng.value)}<br><span>${ic("pencil")}Completamos tu dirección. Puedes corregirla si hace falta.</span>`; refreshIcons();
  }, () => {
    btn.disabled = false;
    status.innerHTML = `<span class="bad">${ic("circle-x")}No pudimos obtener tu ubicación. Permite el acceso o escribe la dirección.</span>`; refreshIcons();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

async function doLogin(form) {
  const f = Object.fromEntries(new FormData(form));
  const cedula = Cedula.limpiar(f.cedula);
  if (!Cedula.valida(cedula)) return showFormError(form, "Revisa tu cédula: no es válida.");
  if (!f.password) return showFormError(form, "Escribe tu contraseña.");
  Recordar.set(!!f.recordar);
  setBusy(form, true, "Entrando…");
  const { error } = await sb.auth.signInWithPassword({ email: Cedula.correo(cedula), password: f.password });
  if (error) { setBusy(form, false); return showFormError(form, /invalid/i.test(error.message) ? "Cédula o contraseña incorrecta." : "No pudimos iniciar sesión. Inténtalo de nuevo."); }
  Recordar.guardarCedula(f.recordar ? cedula : "");
  await loadUser();
  afterAuth(form.dataset.next, `¡Bienvenido, ${state.user ? state.user.nombre.split(" ")[0] : ""}!`);
}

async function doSignup(form) {
  const f = Object.fromEntries(new FormData(form));
  const cedula = Cedula.limpiar(f.cedula), telefono = String(f.telefono || "").replace(/\D/g, "");
  const loc = readLocation(form);
  if (!Cedula.valida(cedula)) return showFormError(form, "La cédula no es válida. Revísala.");
  if ((f.nombre || "").trim().length < 3) return showFormError(form, "Escribe tu nombre completo.");
  if (telefono.length < 10) return showFormError(form, "Escribe un teléfono de 10 dígitos.");
  if ((f.password || "").length < 6) return showFormError(form, "La contraseña debe tener al menos 6 caracteres.");
  if (!loc.direccion || !loc.sector) return showFormError(form, "Escribe tu dirección y sector (o toca “Usar mi ubicación actual”).");
  if (!f.acepto) return showFormError(form, "Debes aceptar el aviso de privacidad para crear tu cuenta.");
  Recordar.set(!!f.recordar);
  setBusy(form, true, "Creando tu cuenta…");
  try {
    await registrarCliente({ cedula, nombre: f.nombre.trim(), telefono, password: f.password, ...loc });
  } catch (err) { setBusy(form, false); return showFormError(form, err.message); }
  const { error } = await sb.auth.signInWithPassword({ email: Cedula.correo(cedula), password: f.password });
  if (error) { setBusy(form, false); return showFormError(form, "Tu cuenta se creó, pero no pudimos entrar. Inicia sesión."); }
  Recordar.guardarCedula(f.recordar ? cedula : "");
  await loadUser();
  afterAuth(form.dataset.next, "¡Cuenta creada! Bienvenido.");
}

async function saveProfile(form) {
  const f = Object.fromEntries(new FormData(form));
  const telefono = String(f.telefono || "").replace(/\D/g, "");

  if ((f.nombre || "").trim().length < 3) return showFormError(form, "Escribe tu nombre completo.");
  if (telefono.length < 10) return showFormError(form, "Escribe un teléfono de 10 dígitos.");
  if (!loc.direccion || !loc.sector) return showFormError(form, "Escribe tu dirección y sector.");
  setBusy(form, true, "Guardando…");

  render(); showProfile(); toast("Datos actualizados");
}

async function placeOrder(form) {
  const f = Object.fromEntries(new FormData(form));
  const delivery = f.entrega === "delivery" && deliveryOn();
  const loc = delivery ? readLocation(form) : null;
  if (delivery && (!loc.direccion || !loc.sector)) return showFormError(form, "Escribe la dirección y el sector de entrega.");
  if (!state.cart.length) return closeAll();
  setBusy(form, true, "Enviando pedido…");
  const { data: order, error } = await sb.rpc("crear_pedido", {
    p_items: state.cart.map((l) => ({ id: l.id, qty: l.qty })),
    p_entrega: delivery ? "delivery" : "retiro",
    p_direccion: delivery ? addressText(loc) : null,
    p_lat: loc?.lat ?? null, p_lng: loc?.lng ?? null,
    p_pago: f.pago, p_nota: f.nota || null,
  });
  if (error) {
    setBusy(form, false);
    showFormError(form, /quedan|disponible|vacío|dirección|sesión/i.test(error.message) ? error.message : "No pudimos enviar el pedido. Inténtalo de nuevo.");
    reloadCatalog();
    return;
  }
  if (delivery && f.guardarDir) {
    const { error: e2 } = await sb.from("profiles").update(loc).eq("id", state.user.id);
    if (!e2) Object.assign(state.user, loc);
  }
  state.cart = []; save();
  state.orders = [order, ...state.orders.filter((o) => o.id !== order.id)];
  state.bought = [...new Set([...order.items.map((i) => i.id), ...state.bought])];
  render();
  showOrder(order.id, true);
  reloadCatalog();
}

function showOrder(id, isNew = false) {
  const o = state.orders.find((x) => x.id === id);
  if (!o) return;
  state.openOrder = id;
  const when = Object.fromEntries((o.historial || []).map((h) => [h.estado, h.at]));
  const pasos = pasosPedido(o.entrega);
  const idx = pasos.indexOf(o.estado);
  const tracker = o.estado === "cancelado"
    ? `<div class="cancel-box">${ic("circle-x")}<div><b>Pedido cancelado</b><span>${when.cancelado ? fmtTime(when.cancelado) : ""}</span></div></div>`
    : `<div class="tracker">${pasos.map((k, i) => `<div class="tstep ${i < idx ? "done" : i === idx ? "current" : ""}">
        <span class="tdot">${ic(ESTADOS[k].i)}</span>
        <div><b>${ESTADOS[k].t}</b><span>${when[k] ? fmtTime(when[k]) : i === idx ? "" : "—"}${i === idx ? ` · ${ESTADOS[k].d}` : ""}</span></div></div>`).join("")}</div>`;
  modal(`${modalHead(isNew ? "¡Pedido recibido!" : `Pedido #${o.id}`, isNew ? `Pedido #${o.id} · ya llegó a la tienda` : fmtTime(o.created_at))}
    ${isNew ? `<div class="ok-banner">${ic("party-popper")}<div><b>Gracias, ${esc(state.user.nombre.split(" ")[0])}.</b><span>Te avisaremos aquí cada vez que cambie el estado.</span></div></div>` : ""}
    <div class="order-status">${statusPill(o)}<span class="live">${ic("radio")}En vivo</span></div>
    ${tracker}
    <div class="ck-items">${(o.items || []).map((i) => `<div><span>${i.qty} × ${esc(Ficha.de(i.nombre, byId(i.id)?.cat || "").titulo)}</span><b>${money(i.precio * i.qty)}</b></div>`).join("")}</div>
    ${Number(o.envio) ? `<div class="sum"><span>Delivery</span><span>${money(Number(o.envio))}</span></div>` : ""}
    <div class="sum total" style="margin:6px 0 12px"><span>Total</span><span>${money(Number(o.total))}</span></div>
    <div class="note">${ic(o.entrega === "delivery" ? "map-pin" : "store")}${o.entrega === "delivery" ? esc(o.direccion || "") : "Retiro en la tienda"} · Pago: ${esc(o.pago || "")}</div>
    <div style="display:grid;gap:8px;margin-top:14px">
      ${o.estado === "pendiente" ? `<button class="btn btn-outline btn-block" data-action="cancel-order" data-id="${o.id}">${ic("x")}Cancelar pedido</button>` : ""}
      <a class="match btn-block" href="${waLink(`Hola, tengo una pregunta sobre mi pedido #${o.id}.`)}" target="_blank" rel="noopener">${ic("message-circle")}¿Dudas sobre tu pedido? Escríbenos</a>
      ${isNew ? `<button class="btn btn-dark btn-block" data-action="close">Seguir comprando</button>` : `<button class="btn btn-outline btn-block" data-action="account">${ic("arrow-left")}Mis pedidos</button>`}
    </div>`);
}

async function cancelOrder(id) {
  if (!confirm("¿Seguro que quieres cancelar este pedido?")) return;
  const { data, error } = await sb.rpc("cancelar_mi_pedido", { p_id: id });
  if (error) return toast(/confirmado/.test(error.message) ? error.message : "No pudimos cancelar el pedido.", "alert-circle");
  state.orders = state.orders.map((o) => (o.id === id ? data : o));
  showOrder(id); render(); reloadCatalog(); toast("Pedido cancelado", "circle-x");
}

/* Tiempo real: estado de mis pedidos y existencia de productos */
let ordersChannel = null;
function subscribeOrders() {
  if (ordersChannel) { sb.removeChannel(ordersChannel); ordersChannel = null; }
  if (!state.user) return;
  ordersChannel = sb.channel("mis-pedidos")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders", filter: `user_id=eq.${state.user.id}` }, ({ new: o }) => {
      const prev = state.orders.find((x) => x.id === o.id);
      state.orders = state.orders.some((x) => x.id === o.id) ? state.orders.map((x) => (x.id === o.id ? o : x)) : [o, ...state.orders];
      if (prev && prev.estado !== o.estado) toast(`Pedido #${o.id}: ${ESTADOS[o.estado].t}`, ESTADOS[o.estado].i);
      if (state.openOrder === o.id && $("#modal").classList.contains("open")) showOrder(o.id);
      render();
    })
    .subscribe();
}
let catalogTimer = null;
function reloadCatalog() {
  clearTimeout(catalogTimer);
  catalogTimer = setTimeout(async () => { try { await loadCatalog(); render(); } catch {} }, 400);
}
function subscribeCatalog() {
  sb.channel("catalogo")
    .on("postgres_changes", { event: "*", schema: "public", table: "products" }, reloadCatalog)
    .on("postgres_changes", { event: "*", schema: "public", table: "categories" }, reloadCatalog)
    .subscribe();
}

/* ---------- Delegación de eventos ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const id = Number(el.dataset.id);
  const p = id ? byId(id) : null;
  const go = (patch) => { Object.assign(state, { cat: null, list: null, q: "", sort: "" }, patch); $("#searchInput").value = state.q; closeAll(); render(); scrollTo({ top: 0, behavior: "smooth" }); };
  switch (el.dataset.action) {
    case "home": go({ view: "home" }); break;
    case "catalog": go({ view: "catalog" }); break;
    case "cat": go({ view: "catalog", cat: el.dataset.val }); break;
    case "list": go({ view: "catalog", list: el.dataset.val }); break;
    case "scroll-cats": $("#catSections").scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "qty+": case "qty-": {
      const up = el.dataset.action === "qty+", r = el.getBoundingClientRect(), before = state.qty[id] || 1;
      state.qty[id] = up ? Math.min(before + 1, p.stock) : Math.max(before - 1, 1);
      showDetail(id);
      if (state.qty[id] !== before) floatNum(up ? "+1" : "-1", r, !up);
      break;
    }
    case "add": if (addToCart(id, state.qty[id] || 1, el)) { state.qty[id] = 1; closeAll(); } break;
    case "buy": if (addToCart(id, state.qty[id] || 1) || state.cart.some((l) => l.id === id)) showCheckout(); break;
    case "detail": showDetail(id); break;
    case "viewer": openViewer(byId(id)); break;
    case "cart": openPanel($("#cartDrawer")); break;
    case "cart+": case "cart-": {
      const up = el.dataset.action === "cart+", r = el.getBoundingClientRect();
      const l = state.cart.find((x) => x.id === id);
      if (up && l.qty >= p.stock) { toast("No hay más unidades disponibles", "alert-circle"); break; }
      if (up) l.qty++; else if (l.qty > 1) l.qty--; else state.cart = state.cart.filter((x) => x.id !== id);
      save(); render();
      floatNum(up ? "+1" : "-1", r, !up);
      if (up) hitCart();
      const q = document.querySelector(`[data-cartqty="${id}"]`);
      if (q) q.classList.add("qty-tick", ...(up ? [] : ["down"]));
      break;
    }
    case "remove": state.cart = state.cart.filter((x) => x.id !== id); save(); render(); break;
    case "checkout": showCheckout(); break;
    case "account": showAccount(); break;
    case "logout": closeAll(); sb.auth.signOut().then(() => { Object.assign(state, { user: null, orders: [], bought: [] }); subscribeOrders(); render(); toast("Sesión cerrada", "log-out"); }); break;
    case "order": showOrder(id); break;
    case "cancel-order": cancelOrder(id); break;
    case "retry": init(); break;
    case "theme": toggleTheme(); break;
    case "install": installApp(); break;
    case "auth-mode": showAccount(el.dataset.next, el.dataset.val); break;
    case "edit-profile": showEditProfile(); break;
    case "gps": useGps(el); break;
    case "forgot": wa(`Hola, olvidé la contraseña de mi cuenta en la tienda. Mi cédula es: `); break;
    case "close": closeAll(); state.openOrder = null; salirDeProducto(); break;
    case "share": compartir(p); break;
    case "match": wa(`Hola, vi más barato el producto "${titulo(p)}" (${money(finalPrice(p))} en su tienda). ¿Me igualan el precio?`); break;
    case "notify": wa(`Hola, avísenme cuando llegue: "${titulo(p)}".`); break;
    case "whatsapp": wa(`Hola ${CONFIG.marca}, tengo una consulta.`); break;
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "searchForm") {
    state.q = $("#searchInput").value.trim();
    Object.assign(state, { view: state.q ? "catalog" : "home", cat: null, list: null, sort: "" });
    render(); scrollTo({ top: 0, behavior: "smooth" });
  } else if (e.target.id === "loginForm") {
    doLogin(e.target);
  } else if (e.target.id === "signupForm") {
    doSignup(e.target);
  } else if (e.target.id === "profileForm") {
    saveProfile(e.target);
  } else if (e.target.id === "checkoutForm") {
    placeOrder(e.target);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "sort") return;
  state.sort = e.target.value; render();
});
document.addEventListener("input", (e) => {
  if (!e.target.matches("[data-cedula]")) return;
  const el = e.target, before = el.value.length, pos = el.selectionStart;
  el.value = Cedula.formato(el.value);
  const p = Math.max(0, pos + el.value.length - before); el.setSelectionRange(p, p);
  updateCedulaHint(el);
});
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if ($("#viewer")) return closeViewer(); closeAll(); salirDeProducto(); });
// Atrás / adelante del navegador: abre o cierra el producto de la dirección
window.addEventListener("popstate", () => {
  closeViewer();
  const id = idEnUrl();
  if (id && byId(id)) showDetail(id);
  else { if ($("#modal").classList.contains("open") && $("#modal .detail-thumb")) closeAll(); document.title = tituloTienda(); }
});
async function compartir(p) {
  const url = urlProducto(p), title = titulo(p);
  const text = `${title} · ${money(finalPrice(p))} en ${CONFIG.marca || "Romana CompuService"}`;
  if (navigator.share) { try { await navigator.share({ title, text, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(url); toast("Enlace copiado. Pégalo donde quieras", "link"); }
  catch { prompt("Copia el enlace del producto:", url); }
}

async function init() {
  $("#app").innerHTML = `<div class="empty" style="margin-top:40px">${ic("loader-circle")}Cargando catálogo…</div>`; refreshIcons();
  try {
    if (!sb) throw new Error("sin conexión");
    await loadCatalog();
  } catch {
    $("#app").innerHTML = `<div class="empty" style="margin-top:40px">${ic("wifi-off")}No pudimos cargar el catálogo. Revisa tu conexión.<button class="btn btn-dark" data-action="retry">${ic("refresh-cw")}Reintentar</button></div>`;
    refreshIcons(); return;
  }
  render(); loadUser(); subscribeCatalog();
  const id = idEnUrl();
  if (id && byId(id)) showDetail(id);
  else if (id) { history.replaceState({}, "", "/"); toast("Ese producto ya no está disponible", "package-x"); }
}
/* ======================================================
   Modo noche (se recuerda en el dispositivo)
   ====================================================== */
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const currentTheme = () => document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light");
function paintThemeBtn() {
  const dark = currentTheme() === "dark";
  const b = $("#themeBtn");
  b.innerHTML = ic(dark ? "sun" : "moon");
  b.title = dark ? "Modo día" : "Modo noche";
  b.setAttribute("aria-label", dark ? "Activar modo día" : "Activar modo noche");
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = dark ? "#000000" : "#0a0a0a";
  refreshIcons();
}
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("tc_theme", next); } catch {}
  paintThemeBtn();
  toast(next === "dark" ? "Modo noche activado" : "Modo día activado", next === "dark" ? "moon" : "sun");
}
darkMQ.addEventListener?.("change", paintThemeBtn);

/* ======================================================
   Celular: el encabezado se esconde al bajar y vuelve al subir
   ====================================================== */
const enCelular = window.matchMedia("(max-width: 640px)");
let ultimoY = window.scrollY;
function ajustarEncabezado() {
  const h = $("header"), y = Math.max(0, window.scrollY), dy = y - ultimoY;
  const fijo = !enCelular.matches || y < 120 || document.activeElement === $("#searchInput") || $("#overlay").classList.contains("open");
  if (fijo || dy < -6) h.classList.remove("oculto");
  else if (dy > 8) h.classList.add("oculto");
  if (Math.abs(dy) > 6 || fijo) ultimoY = y;
}
window.addEventListener("scroll", ajustarEncabezado, { passive: true });
enCelular.addEventListener?.("change", ajustarEncabezado);

/* ======================================================
   Instalar la tienda como app (Android, iPhone y computadora)
   ====================================================== */
let installPrompt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /android/i.test(navigator.userAgent);
const isIOSSafari = isIOS && !/crios|fxios|edgios|opios/i.test(navigator.userAgent);
function updateInstallBtn() {
  $("#installBtn").hidden = isStandalone() || !(installPrompt || isIOS || isAndroid);
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; updateInstallBtn(); });
window.addEventListener("appinstalled", () => { installPrompt = null; updateInstallBtn(); closeAll(); toast("¡App instalada! Búscala en tu pantalla de inicio", "smartphone"); });

async function installApp() {
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null; updateInstallBtn();
    if (outcome === "accepted") toast("Instalando la app…", "smartphone");
    return;
  }
  const head = `<div class="install-head"><img src="apple-touch-icon.png" alt=""><div><b>${esc(CONFIG.marca)}</b><span>Tu tienda a un toque, desde la pantalla de inicio.</span></div></div>`;
  let steps;
  if (isIOS && !isIOSSafari) {
    steps = `<div class="note" style="margin:0 0 12px">${ic("info")}En iPhone solo se puede instalar desde <b>Safari</b>. Copia el enlace y ábrelo en Safari.</div>
      <ol class="install-steps"><li><span>Abre esta página en Safari</span></li><li><span>Toca <b>Compartir</b> ${ic("share")} abajo en la pantalla</span></li><li><span>Elige <b>Agregar a pantalla de inicio</b> ${ic("square-plus")}</span></li><li><span>Toca <b>Agregar</b> arriba a la derecha</span></li></ol>`;
  } else if (isIOS) {
    steps = `<ol class="install-steps"><li><span>Toca <b>Compartir</b> ${ic("share")} abajo en la pantalla</span></li><li><span>Desliza y elige <b>Agregar a pantalla de inicio</b> ${ic("square-plus")}</span></li><li><span>Toca <b>Agregar</b> arriba a la derecha</span></li></ol>`;
  } else {
    steps = `<ol class="install-steps"><li><span>Toca el menú ${ic("ellipsis-vertical")} arriba a la derecha del navegador</span></li><li><span>Elige <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b></span></li><li><span>Confirma con <b>Instalar</b></span></li></ol>`;
  }
  modal(`${modalHead("Instala la app", "Gratis, sin tienda de apps y sin ocupar espacio.")}${head}${steps}
    <button class="btn btn-dark btn-block" data-action="close">Entendido</button>`);
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
paintThemeBtn();
updateInstallBtn();
init();
</script>
</body>
